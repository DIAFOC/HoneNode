# SharpNode-specific WAF rules.
#
# The owasp/modsecurity-crs image already loads the OWASP CRS. These rules
# cover the SharpNode deployment surface and a deliberate demo probe.

# The operator dashboard is internal-only; the public panel must not expose it.
SecRule REQUEST_URI "@beginsWith /operator" \
  "id:1000010,phase:1,t:none,deny,status:403,log,auditlog,msg:'SharpNode operator surface is internal only'"

# The broker API is internal-only.
SecRule REQUEST_URI "@beginsWith /api/v1/broker" \
  "id:1000011,phase:1,t:none,deny,status:403,log,auditlog,msg:'SharpNode broker API is internal only'"

# Common scanner user agents.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|acunetix|nessus)" \
  "id:1000012,phase:1,t:none,deny,status:403,log,auditlog,msg:'SharpNode scanner user-agent'"

# Deliberate demo probe: curl -H 'X-Lab-Bloquear: si' http://127.0.0.1:8080/
SecRule REQUEST_HEADERS:X-Lab-Bloquear "@streq si" \
  "id:1000013,phase:1,t:none,deny,status:403,log,auditlog,msg:'SharpNode WAF test header'"

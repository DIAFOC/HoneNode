[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              systemd
    Tag               honenode
    Systemd_Filter    _SYSTEMD_UNIT=honed.service
    Systemd_Filter    _SYSTEMD_UNIT=honenode.service
    Read_From_Tail    On

[INPUT]
    Name              tail
    Path              /srv/waf/logs/audit.log
    Tag               waf.audit
    Parser            json
    DB                /var/lib/fluent-bit/waf-audit.db

[INPUT]
    Name              tail
    Path              /srv/waf/logs/access.log
    Tag               waf.access
    Parser            nginx
    DB                /var/lib/fluent-bit/waf-access.db

[INPUT]
    Name              tail
    Path              /srv/waf/logs/error.log
    Tag               waf.error
    DB                /var/lib/fluent-bit/waf-error.db

# Enable this input after Caddy is installed.
#[INPUT]
#    Name              tail
#    Path              /var/log/caddy/*.log
#    Tag               caddy
#    Parser            json
#    DB                /var/lib/fluent-bit/caddy.db

[FILTER]
    Name              modify
    Match             honenode
    Add               index honenode
    Add               sourcetype honenode

[FILTER]
    Name              modify
    Match             waf.audit
    Add               index waf
    Add               sourcetype waf_audit

[FILTER]
    Name              modify
    Match             waf.access
    Add               index waf
    Add               sourcetype waf_access

[FILTER]
    Name              modify
    Match             waf.error
    Add               index waf
    Add               sourcetype waf_error

[FILTER]
    Name              modify
    Match             caddy
    Add               index caddy
    Add               sourcetype caddy

[OUTPUT]
    Name              splunk
    Match             *
    Host              127.0.0.1
    Port              18088
    Splunk_Token      REPLACE_WITH_SPLUNK_HEC_TOKEN
    Splunk_Send_Raw   Off
    TLS               Off

{% if has_jobs %}
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Acción</th>
        <th>Estado</th>
        <th>Iniciado</th>
        <th>Error</th>
      </tr>
    </thead>
    <tbody>
      {% for job in jobs %}
      <tr>
        <td class="mono">{{ job.id }}</td>
        <td class="mono">{{ job.action }}</td>
        <td><span class="badge {{ job.state_class }}">{{ job.state_label }}</span></td>
        <td>{{ job.started }}</td>
        <td class="mono">{{ job.error }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="empty">Sin trabajos registrados.</p>
{% endif %}

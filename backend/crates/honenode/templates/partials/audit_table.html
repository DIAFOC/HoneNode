{% if has_events %}
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ts</th>
        <th>actor</th>
        <th>action</th>
        <th>resource</th>
        <th>outcome</th>
        <th>reason</th>
        <th>src_ip</th>
      </tr>
    </thead>
    <tbody>
      {% for event in events %}
      <tr>
        <td class="mono">{{ event.ts }}</td>
        <td class="mono">{{ event.actor }}</td>
        <td class="mono">{{ event.action }}</td>
        <td class="mono">{{ event.resource }}</td>
        <td><span class="badge {{ event.outcome_class }}">{{ event.outcome }}</span></td>
        <td class="mono">{{ event.reason }}</td>
        <td class="mono">{{ event.src_ip }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p class="empty">Sin eventos.</p>
{% endif %}

[workspace]
resolver = "2"
members = ["crates/honenode", "crates/honed"]

[workspace.package]
version = "0.8.8"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

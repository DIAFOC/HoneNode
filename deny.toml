# cargo-deny configuration for the HoneNode workspace.
# Run from the repository root: cargo deny --manifest-path backend/Cargo.toml check

[advisories]
version = 2
yanked = "warn"
ignore = [
  # sqlx 0.8.6 pins libsqlite3-sys ^0.30.1. The fix ships in libsqlite3-sys
  # 0.39 (sqlx 0.9), which requires Rust 1.94 and is therefore not buildable
  # with the Rocky 10 distro toolchain. Revisit when the bundles move to a
  # newer toolchain. Exposure requires a crafted database + WAL pair written
  # by a less-trusted local party; tenants cannot write the registry directory.
  "RUSTSEC-2026-0459",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

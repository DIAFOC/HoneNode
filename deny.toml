# cargo-deny configuration for the HoneNode workspace.
# Run from the repository root: cargo deny --manifest-path backend/Cargo.toml check

[advisories]
version = 2
yanked = "warn"
ignore = [
  # sqlx 0.9.1 still pins libsqlite3-sys ^0.30.1; the fix waits on upstream
  # adoption of libsqlite3-sys 0.39. Exposure needs a crafted database + WAL
  # pair written by a less-trusted local party; the registry directory is
  # root/app-owned and tenants have no host access. Revisit in 0.8.9.
  "RUSTSEC-2026-0459",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, documentation examples and the STRIDE evidence"
paths = [
  '''backend/crates/honenode/src/tests\.rs''',
  '''backend/crates/honenode/src/observation_tests\.rs''',
  '''backend/crates/honenode/src/portal_service_tests\.rs''',
  '''backend/crates/honenode/src/provisioning_tests\.rs''',
  '''backend/crates/honenode/tests/.*''',
  '''packaging/tests/.*''',
  '''backend/crates/honenode/SIGNUP_BILLING\.md''',
  '''security/HoneNode_Threat_Model_STRIDE\.json''',
]

# Test modules in the broker crate use these obvious placeholders as fixture
# passwords. Match the line, not the whole file, so a real secret in the same
# source file is still reported.
[[allowlists]]
description = "Fake credentials used by broker unit tests"
regexTarget = "line"
regexes = [
  '''correct horse battery''',
  '''unique-secret-value''',
  '''supersecretvalue''',
  '''secret-wire-value''',
  '''"password": "short"''',
]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Format (advisory)
        continue-on-error: true
        working-directory: backend
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features
      - name: Tests
        working-directory: backend
        run: |
          set -o pipefail
          cargo test --all-targets --all-features 2>&1 | tee /tmp/rust-tests.log
      - name: Rust test summary
        if: always()
        run: |
          {
            echo '### Rust tests'
            grep -E '^test result:' /tmp/rust-tests.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release build
        working-directory: backend
        run: cargo build --release --locked

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Release binaries for packaging tests
        run: cargo build --release --locked --manifest-path backend/Cargo.toml
      - name: Application tests
        run: |
          set -o pipefail
          python -m unittest discover -s backend/crates/honenode/tests -v 2>&1 | tee /tmp/app-tests.log
      - name: Application test summary
        if: always()
        run: |
          {
            echo '### Python app tests'
            tail -n 3 /tmp/app-tests.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Packaging tests
        run: |
          set -o pipefail
          python -m unittest discover -s packaging/tests -v 2>&1 | tee /tmp/packaging-tests.log
      - name: Packaging test summary
        if: always()
        run: |
          {
            echo '### Python packaging tests'
            tail -n 3 /tmp/packaging-tests.log || true
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Ignored advisories:
      # - RUSTSEC-2026-0459: sqlx 0.9.1 still pins libsqlite3-sys 0.30.1; the
      #   fix waits on upstream adoption of 0.39. Exposure needs a crafted
      #   registry DB+WAL pair that tenants cannot write.
      # - RUSTSEC-2023-0071: rsa is reachable only through sqlx-mysql, an
      #   optional dependency that this workspace does not compile.
      - name: Cargo Audit
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz" \
            | tar -xz -C /tmp
          /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit audit \
            --file backend/Cargo.lock \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2023-0071

      - name: Cargo Deny
        if: always()
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check

      - name: Semgrep SAST
        if: always()
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep scan \
            --metrics off \
            --config p/security-audit \
            --config p/secrets \
            --config security/semgrep.yml \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep.sarif \
            --exclude '**/tests/**' \
            --exclude '**/tests.rs' \
            --exclude '**/*_tests.rs' \
            --exclude '**/*.md' \
            --exclude 'security/HoneNode_Threat_Model_STRIDE.json' \
            .
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Trivy filesystem scan
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: v0.76.2
          limit-severities-for-sarif: true
          skip-dirs: '.git,.cache,backend/target,packaging/os/dist,packaging/.local-run'
          skip-files: 'backend/crates/honenode/src/tests.rs,backend/crates/honenode/src/observation_tests.rs,backend/crates/honenode/src/portal_service_tests.rs,backend/crates/honenode/src/provisioning_tests.rs,backend/crates/honenode/tests/*,packaging/tests/*,backend/crates/honenode/SIGNUP_BILLING.md,security/HoneNode_Threat_Model_STRIDE.json'
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Betterleaks is the maintained successor to Gitleaks by the same
      # authors (MIT, no license key). The SARIF report keeps results in the
      # Security tab; the scan itself fails the job on any finding.
      - name: Betterleaks secrets scan
        if: always()
        run: |
          set -euo pipefail
          asset=betterleaks_1.10.1_linux_x64.tar.gz
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/${asset}" \
            -o "/tmp/${asset}"
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/checksums.txt" \
            -o /tmp/betterleaks-checksums.txt
          (cd /tmp && grep " ${asset}$" betterleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${asset}" -C /tmp
          /tmp/betterleaks git . \
            --config .betterleaks.toml \
            --report-format sarif \
            --report-path betterleaks.sarif \
            --no-banner \
            --redact \
            --exit-code 1
      - name: Upload Betterleaks SARIF
        if: always() && hashFiles('betterleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

      - name: OSV-Scanner (report-only)
        if: always()
        continue-on-error: true
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --lockfile backend/Cargo.lock \
            --format sarif --output-file osv-scanner.sarif || true
      - name: Upload OSV-Scanner SARIF
        if: always() && hashFiles('osv-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

      - name: ShellCheck
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find packaging -name '*.sh' -print0 | xargs -0 -r shellcheck -x -S error
      - name: Hadolint
        if: always()
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Containerfile
          failure-threshold: error
      - name: Actionlint
        if: always()
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Security scan summary
        if: always()
        run: |
          {
            echo '### Security scan results'
            for report in *.sarif; do
              count=$(jq '[.runs[].results[]?] | length' "$report" 2>/dev/null || echo '?')
              printf -- '- %s: %s result(s)\n' "$report" "$count"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency review
        if: always() && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5

  dast:
    name: ZAP baseline DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Containerfile
          tags: honenode-app:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: honenode-app:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          version: v0.76.2
          limit-severities-for-sarif: true
      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Start app
        run: |
          docker run -d --name honenode-app \
            -p 127.0.0.1:8088:8080 \
            -e HONE_BIND=0.0.0.0:8080 \
            -e HONE_REGISTRY=/tmp/registry.db \
            -e HONE_STATIC_DIR=/app/static \
            -e HONE_TENANTS=t91 \
            -e HONE_SECURE_COOKIES=false \
            -e HONE_SERVICE_ACCESS=public \
            honenode-app:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8088/healthz
      - name: ZAP baseline
        run: |
          mkdir -p zap
          chmod 0777 zap
          docker run --rm --network host \
            -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8088/ -m 1 -I \
              -r zap-report.html -J zap-report.json -w zap-report.md
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: zap/
      - name: App logs
        if: always()
        run: docker logs honenode-app || true
      - name: Stop app
        if: always()
        run: docker stop honenode-app || true

  rocky-build:
    name: Rocky 10 bundle build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: quay.io/rockylinux/rockylinux:10
      options: --user root
    env:
      HONENODE_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the Rocky bundle
        run: |
          dnf -y install gcc make python3
          bash packaging/os/rocky/build.sh
      - name: Upload Rocky bundle
        uses: actions/upload-artifact@v7
        with:
          name: rocky-bundle
          path: packaging/os/dist/*.tar.gz
          if-no-files-found: error

  # Run the bundle installer and the full smoke inside a Rocky 10 init container
  # so systemd is PID 1. This exercises the same artifact users get, not a source
  # rebuild, and it gates the workflow.
  smoke-rocky:
    name: Rocky 10 bundle install + smoke
    needs: rocky-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: quay.io/rockylinux/rockylinux:10-ubi-init
      options: --privileged --cgroupns=host
    env:
      HONENODE_REPO: ${{ github.workspace }}
      HONE_SUBID_BASE: 2000
      HONE_SUBID_COUNT: 63536
    steps:
      - uses: actions/checkout@v7
      - name: Download Rocky bundle
        uses: actions/download-artifact@v8
        with:
          name: rocky-bundle
          path: bundle-archive
      - name: Prepare bundle
        run: |
          for _ in $(seq 1 60); do
            state=$(systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          systemctl is-system-running || true
          dnf -y install python3 curl
          mkdir -p /workspace/bundle
          tar -xzf bundle-archive/*.tar.gz -C /workspace/bundle
          bundle_dir=$(find /workspace/bundle -maxdepth 1 -mindepth 1 -type d -name 'honenode-*' | head -1)
          test -n "$bundle_dir"
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"
      - name: Install the bundle
        run: python3 "$BUNDLE_DIR/install.py" --yes --install-deps 2>&1 | tee /tmp/installer.log
      - name: Verify installed services
        run: |
          systemctl --no-pager --full status honed.service honenode.service
          curl -fsS http://127.0.0.1:8088/healthz >/dev/null
      - name: Run Rocky smoke against the bundle binaries
        run: |
          set -o pipefail
          HONED_BIN="$BUNDLE_DIR/broker/honed" \
          HONENODE_BIN="$BUNDLE_DIR/native/honenode" \
            bash packaging/rocky/smoke.sh 2>&1 | tee /tmp/rocky-smoke.log
      - name: Test summary
        if: always()
        run: |
          {
            echo '### Rocky bundle install + smoke'
            systemctl is-active honed.service honenode.service || true
            grep '^PASS=' /tmp/rocky-smoke.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Rocky smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rocky-smoke-log
          path: /tmp/rocky-smoke.log
          if-no-files-found: warn
